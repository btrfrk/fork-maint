name: fluffychat
repo: null                          # the FluffyChat checkout
upstream:
  remote: origin                    # https://github.com/krille-chan/fluffychat.git
  track:
    branch: main
fork:
  branch: working
  # remote (host config): pushed after a successful build
patches: git log --oneline origin/main..working
  # Update policy                   removes AGENTS.md; keep it first in the stack
  # feat: add account-scoped personal chat names   (+2 test commits)
  # build(android): update Gradle plugin and distinguish debug app
  # build(android): enable optimized personal release builds
  # fix: preserve session encryption during token refresh   (Matrix SDK patch, see NOTES.md)
  # build: allow blank context lines in dependency patches
  # build(android): sign personal releases with a dedicated key
  # build: patch pub.dev packages for compileSdk 37
  # build(android): keep the notification icon in shrunk release builds
rebase:
  upstream_wins: [pubspec.lock]     # regenerated by `flutter pub get` in the box
inputs:
  matrix_sdk: null                  # famedly/matrix-dart-sdk clone
flake: .                            # nix develop <flake> -i --keep HOME, cwd the repo
box:                                # shell commands, in order, in the workspace clone
  fetch:                            # the only phase with a network route
    # The patched Matrix SDK must exist before pub resolves the path override.
    - bash scripts/prepare-matrix-sdk.sh "$INPUT_matrix_sdk" || { rm -rf build/matrix-sdk && bash scripts/prepare-matrix-sdk.sh "$INPUT_matrix_sdk"; }
    # Like the SDK: the script refuses a stale prepared package; drop and redo.
    - scripts/prepare-pub-packages.sh || { rm -rf build/flutter-vodozemac build/flutter-shortcuts-new && scripts/prepare-pub-packages.sh; }
    - flutter pub get
    # cargokit builds the vodozemac bindings for the APK with rustup's stable
    # and the Android target; the test library is a plain cargo build.
    - rustup default stable && rustup target add aarch64-linux-android
    - cargo fetch --manifest-path build/flutter-vodozemac/rust/Cargo.toml
    # cargokit's build tool resolves a runner package from pub.dev on first
    # use, in the directory the Gradle plugin passes it. Its cache key hashes
    # a listing that includes the script path, so spell it as the plugin
    # does: absolute, via gradle/.. .
    - >-
      CARGOKIT_TOOL_TEMP_DIR="$PWD/build/flutter_vodozemac/build/build_tool"
      bash "$PWD/build/flutter-vodozemac/cargokit/gradle/../run_build_tool.sh" --help
    # The test library must match the vodozemac version in pubspec.lock, or
    # flutter_rust_bridge rejects it with a content hash mismatch.
    - >-
      v=$(yq .packages.vodozemac.version pubspec.lock);
      [ -d test/rust/target/debug ] && [ "$(cat test/rust/.fork-version 2>/dev/null)" = "$v" ] ||
      { scripts/prepare_vodozemac.sh && echo "$v" > test/rust/.fork-version; }
    # The screenshot goldens were rendered with Apple's SF Pro.
    - dart run golden_screenshot:download_apple_fonts
    # package:sqlite3's native-asset hook downloads a pinned libsqlite3.so
    # on the first test run and caches it under .dart_tool/hooks_runner.
    - flutter test test/archive_test.dart
    # The same hook runs for the Android target inside the Gradle build;
    # Flutter's release app target runs it without Gradle.
    - >-
      flutter assemble --output=build/hooks-prefetch -dTargetPlatform=android-arm64 -dBuildMode=release
      -dTargetFile=lib/main.dart -dAndroidArchs=android-arm64 release_android_application
    # Gradle has no lock file: write the Flutter build files, then resolve
    # every configuration so the offline build finds the artifacts cached.
    - flutter build apk --config-only --release --target-platform android-arm64
    - cd android && ./gradlew -q -I "$FORK_DIR/resolve-all.gradle" resolveAll
  prepare:
    - flutter pub get --offline
  verify:
    - flutter analyze
    - flutter test test/
  build:
    - >-
      env ORG_GRADLE_PROJECT_personalRelease=true
      ORG_GRADLE_PROJECT_personalKeystore=$BOX_KEYSTORE
      ORG_GRADLE_PROJECT_personalKeyAlias=box
      ORG_GRADLE_PROJECT_personalKeyPasswordFile=$BOX_KEYSTORE_PASS
      flutter build apk --release --target-platform android-arm64 --build-number=$BUILD_NUMBER
    # Referenced only by name from Dart; without it no notification is shown.
    - >-
      "$ANDROID_HOME"/build-tools/*/aapt2 dump resources build/app/outputs/flutter-apk/app-release.apk
      | grep ' drawable/notifications_icon$' >/dev/null
  artifact: build/app/outputs/flutter-apk/app-release.apk
deploy:
  kind: fdroid
  app_id: null                      # the applicationId the fork's release build uses
  repo_dir: null                    # F-Droid repo directory (fdroid update, fdroid deploy)
  keystore: null                    # release keystore
  key_alias: null
  key_pass_file: null
  cert_sha256: null                 # the release certificate; the only signer allowed
  keep: 3                           # APKs kept in repo/
upstreaming:
  issue: https://github.com/krille-chan/fluffychat/issues/2120
  check: maintainer replies, linked PRs or branches, duplicates closed into it
