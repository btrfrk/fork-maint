name: digikam
repo: null                          # the digiKam checkout
upstream:
  remote: origin                    # https://invent.kde.org/graphics/digikam.git
  track:
    branch: master                  # no release since 9.1.0
fork:
  branch: quickfilter
  # remote (host config): the remote arch/PKGBUILD's source= points at
patches: git log --oneline origin/master..quickfilter
  # Introduce FilterController as the icon-view filter state owner
  # Add the quick filter toolbar, availability counts and camera filter
  # Create the quick filter toolbar after createGUI
  # Add "Open With External Editor" action and setting
rootfs: arch                        # Arch root with the PKGBUILD's dependencies; no flake
box:
  fetch: []                         # nothing to download: sources come from the workspace
  prepare:
    # makepkg clones its git source from SRCDEST and, with --holdver, never
    # fetches. A mirror of the workspace gives it the rebased branch.
    - rm -rf "$HOME/srcdest/digikam" && mkdir -p "$HOME/srcdest" && git clone -q --mirror "$PWD" "$HOME/srcdest/digikam"
    - rm -rf "$HOME/pkg/digikam" && mkdir -p "$HOME/pkg" && cp -r "$FORK_DIR/arch" "$HOME/pkg/digikam"
  verify: []                        # the package build compiles the whole tree
  build:
    - mkdir -p out && cd "$HOME/pkg/digikam" && SRCDEST="$HOME/srcdest" PKGDEST="$OLDPWD/out" makepkg -f --holdver
  artifact: out/digikam-btrfrk-*.pkg.tar.zst
package:
  name: digikam-btrfrk              # published on the AUR; arch/ is the package source
deploy:
  kind: arch                        # the report carries the pacman -U command
  package: digikam-btrfrk
  # aur (host config): the AUR package's git URL; arch/ is pushed there when it changes
deployed_check: pacman -Q digikam-btrfrk
upstreaming: none                   # don't propose, don't push to origin, no MRs
